name: Retrofit VOD seeking

on:
  push:
    paths:
      - 'scripts/retrofit-vod-seeking.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'sherif007-noob'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply retrofit
        run: node scripts/retrofit-vod-seeking.mjs
      - name: Commit retrofit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VideoPlayer.tsx server.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: retrofit VOD seeking lifecycle"
          git push
