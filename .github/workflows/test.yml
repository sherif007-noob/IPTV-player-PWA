name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build frontend and server
        run: npm run build

      - name: Verify FFmpeg binary
        run: |
          FFMPEG_PATH="$(node -e "process.stdout.write(require('ffmpeg-static'))")"
          test -x "$FFMPEG_PATH"
          "$FFMPEG_PATH" -version

      - name: Test direct MKV URL seeking with HTTP Range
        run: node scripts/test-direct-mkv-seek.mjs

      - name: Verify built server loads
        run: node --check dist/server.cjs
