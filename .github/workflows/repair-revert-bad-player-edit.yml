name: Repair bad player edit

on:
  push:
    paths:
      - .github/workflows/repair-revert-bad-player-edit.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert accidental player replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 817f311c109cb6143858c0bc8cba1e0d432dd52f
          git rm .github/workflows/repair-revert-bad-player-edit.yml
          git commit --amend --no-edit
          git push origin HEAD:main
