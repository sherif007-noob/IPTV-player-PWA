name: Apply VOD playback duration and seeking fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply VOD duration and seeking fix [skip patch]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch playback
        shell: python
        run: |
          from pathlib import Path
          import re

          vp = Path('src/components/VideoPlayer.tsx')
          text = vp.read_text()

          old = "  const initialTimeRef = useRef<number>(initialTime);\n  initialTimeRef.current = initialTime;"
          new = old + "\n  const knownDurationRef = useRef<number>(0);\n  const lastTranscodedSeekRef = useRef<number>(-1);"
          if old not in text:
              raise SystemExit('VideoPlayer anchor 1 not found')
          if 'knownDurationRef' not in text:
              text = text.replace(old, new, 1)

          old = "  const isLive = item.type === 'live';\n  const isSeries = item.type === 'series' || !!seriesContext;"
          new = old + r'''

  // Xtream supplies the real VOD/episode duration even when the browser is
  // receiving our fragmented MP4 transcoder output (whose duration grows as
  // FFmpeg produces fragments). Keep this value authoritative for the UI.
  useEffect(() => {
    let cancelled = false;
    knownDurationRef.current = 0;
    setDuration(0);

    const applyDuration = (seconds?: number) => {
      if (!cancelled && Number.isFinite(seconds) && Number(seconds) > 0) {
        knownDurationRef.current = Number(seconds);
        setDuration(Number(seconds));
      }
    };

    if (isSeries && seriesContext?.episode?.info?.duration_secs) {
      applyDuration(seriesContext.episode.info.duration_secs);
      return () => { cancelled = true; };
    }

    if (!isLive && item.type === 'vod') {
      xtreamService.getVodDetails(Number(item.id)).then((details) => {
        applyDuration(details?.info?.duration_secs);
      }).catch(() => {});
    }

    return () => { cancelled = true; };
  }, [item.id, item.type, isLive, isSeries, seriesContext?.episode?.id]);

  // The MKV transcoder is a sequential HTTP stream, so browser byte-range
  // seeking cannot work. Convert a user seek into a new transcoder request
  // starting at the requested timestamp instead.
  useEffect(() => {
    const video = videoRef.current;
    if (!video || isLive) return;

    const isTranscodedMkv = (candidate: string) => {
      try {
        const parsed = new URL(candidate, window.location.origin);
        const upstream = parsed.searchParams.get('url') || '';
        return /\.mkv(?:$|\?)/i.test(upstream) && parsed.pathname.includes('/api/xtream/stream');
      } catch {
        return false;
      }
    };

    const handleTranscodedSeeking = () => {
      if (!isTranscodedMkv(activeUrl)) return;

      const maxDuration = knownDurationRef.current || duration || Number.POSITIVE_INFINITY;
      const target = Math.max(0, Math.min(maxDuration, video.currentTime));
      if (target < 1 || Math.abs(target - lastTranscodedSeekRef.current) < 1) return;

      lastTranscodedSeekRef.current = target;
      setPlaybackError(null);
      setIsBuffering(true);
      setBufferingSeconds(0);

      setActiveUrl((prev) => {
        const parsed = new URL(prev, window.location.origin);
        parsed.searchParams.set('start', String(Math.floor(target)));
        return parsed.toString();
      });
    };

    video.addEventListener('seeking', handleTranscodedSeeking);
    return () => video.removeEventListener('seeking', handleTranscodedSeeking);
  }, [activeUrl, duration, isLive]);'''
          if 'The MKV transcoder is a sequential HTTP stream' not in text:
              if old not in text:
                  raise SystemExit('VideoPlayer anchor 2 not found')
              text = text.replace(old, new, 1)

          text = text.replace(
              "    const dur = videoRef.current.duration || duration;",
              "    const dur = knownDurationRef.current || videoRef.current.duration || duration;",
              1,
          )

          # Do not let the fragmented MP4's continuously changing duration overwrite
          # the authoritative Xtream duration.
          text = text.replace(
              "    setDuration(dur);\n\n    // Buffer calculation",
              "    if (!knownDurationRef.current) setDuration(dur);\n\n    // Buffer calculation",
              1,
          )

          vp.write_text(text)

          server = Path('server.ts')
          s = server.read_text()

          old = '''  async function transcodeMkvToMp4(\n    upstream: Response,\n    res: express.Response,\n    streamUrl: string\n  ): Promise<boolean> {'''
          new = '''  async function transcodeMkvToMp4(\n    upstream: Response,\n    res: express.Response,\n    streamUrl: string,\n    startSeconds = 0\n  ): Promise<boolean> {'''
          if old not in s:
              raise SystemExit('server anchor 1 not found')
          if 'startSeconds = 0' not in s:
              s = s.replace(old, new, 1)

          old = '''    const ffmpeg = spawn(ffmpegPath, [\n      "-hide_banner",\n      "-loglevel", "warning",\n      "-i", "pipe:0",'''
          new = '''    const ffmpeg = spawn(ffmpegPath, [\n      "-hide_banner",\n      "-loglevel", "warning",\n      ...(startSeconds > 0 ? ["-ss", String(startSeconds)] : []),\n      "-i", "pipe:0",\n      ...(startSeconds > 0 ? ["-output_ts_offset", String(startSeconds)] : []),'''
          if old not in s:
              raise SystemExit('server anchor 2 not found')
          if '"-output_ts_offset"' not in s:
              s = s.replace(old, new, 1)

          old = '''        const transcoded = await transcodeMkvToMp4(upstream, res, streamUrl);'''
          new = '''        const requestedStart = Number(req.query.start);\n        const startSeconds = Number.isFinite(requestedStart) ? Math.max(0, requestedStart) : 0;\n        const transcoded = await transcodeMkvToMp4(upstream, res, streamUrl, startSeconds);'''
          if old not in s:
              raise SystemExit('server anchor 3 not found')
          s = s.replace(old, new, 1)

          server.write_text(s)

          # Remove this one-shot workflow in the same commit after the patch is applied.
          Path('.github/workflows/apply-playback-fix.yml').unlink()
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VideoPlayer.tsx server.ts .github/workflows/apply-playback-fix.yml
          git commit -m "Apply VOD duration and seeking fix [skip patch]"
          git push
