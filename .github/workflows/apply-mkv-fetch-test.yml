name: Apply MKV fetch test patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply-mkv-fetch-patch.py
      - name: Commit patch
        run: |
          if git diff --quiet server.ts; then
            echo "No server.ts changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix: fetch MKV upstream before FFmpeg [mkv-fetch-patched]"
          git push
