name: Apply VOD seek source fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: node scripts/patch-vod-seek-source.mjs
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VideoPlayer.tsx
          git commit -m "fix: force VOD seek source reload"
          git push origin HEAD:main
      - name: Remove temporary patch files
        run: |
          git rm .github/workflows/apply-vod-seek-fix.yml scripts/patch-vod-seek-source.mjs
          git commit -m "chore: remove temporary VOD seek patch files"
          git push origin HEAD:main
