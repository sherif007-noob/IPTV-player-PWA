name: Apply VOD seek source fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        run: node scripts/patch-vod-seek-source.mjs
      - name: Commit source fix and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/VideoPlayer.tsx
          git commit -m "fix: force VOD seek source reload" || exit 0
          git push origin HEAD:main
