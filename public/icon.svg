<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tvGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- TV Screen Outer Frame -->
  <rect x="96" y="128" width="320" height="230" rx="36" fill="#030712" stroke="url(#tvGlow)" stroke-width="12" filter="url(#glow)" />
  
  <!-- Screen Inner Gradient Display -->
  <rect x="114" y="146" width="284" height="194" rx="22" fill="#0f172a" />
  
  <!-- Modern Center Play Icon -->
  <polygon points="230,195 230,291 316,243" fill="url(#playGrad)" />

  <!-- TV Antenna / Modern Signal Rays -->
  <path d="M 180 82 L 236 128" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <path d="M 332 82 L 276 128" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <circle cx="176" cy="78" r="8" fill="#38bdf8" />
  <circle cx="336" cy="78" r="8" fill="#38bdf8" />

  <!-- TV Base Stand -->
  <path d="M 216 370 L 296 370" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />
  <path d="M 256 358 L 256 370" stroke="#38bdf8" stroke-width="12" />
  <path d="M 176 410 L 336 410" stroke="#64748b" stroke-width="10" stroke-linecap="round" />
  <path d="M 256 370 L 256 410" stroke="#64748b" stroke-width="10" stroke-linecap="round" />

  <!-- 4K / Stream Sparkle Badge -->
  <circle cx="360" cy="176" r="6" fill="#fbbf24" />
  <circle cx="376" cy="188" r="4" fill="#38bdf8" />
</svg>
