<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WebOS Xtream IPTV Player</title>
    <meta name="description" content="High-performance cross-platform IPTV PWA and LG webOS player supporting Xtream Code playlists, Live TV, 4K VOD, Series with episode tracking, offline PWA installability, and adaptive streaming." />
    <meta property="og:title" content="WebOS Xtream IPTV Player" />
    <meta property="og:description" content="High-performance cross-platform IPTV PWA and LG webOS player supporting Xtream Code playlists, Live TV, 4K VOD, Series with episode tracking, offline PWA installability, and adaptive streaming." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IPTV Player" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('webos_tv_font_size') || 'huge';
          document.documentElement.setAttribute('data-tv-font', saved);
          var scales = { small: '100%', medium: '120%', large: '150%', huge: '180%', maximum: '210%' };
          document.documentElement.style.fontSize = scales[saved] || '180%';
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
